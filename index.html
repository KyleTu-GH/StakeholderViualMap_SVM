<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>利害關係人-視覺地圖</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2canvas & jsPDF 用於高品質防截斷 PDF 匯出 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.03); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
    .touch-none { touch-action: none; -webkit-touch-callout: none; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-3 md:p-6">
  <div class="max-w-6xl mx-auto">
    <!-- 頂部標題區 -->
    <header class="mb-4 border-b border-slate-200 pb-3 flex flex-col md:flex-row md:items-end justify-between gap-3">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">利害關係人-視覺地圖</h1>
          <span id="version-tag" class="text-slate-400 text-xs font-mono tracking-tight" title="版本時間戳記"></span>
        </div>
        <div class="mt-2 flex gap-2">
          <button 
            id="toggle-watermark-btn" 
            onclick="toggleWatermark()" 
            class="px-3.5 py-1.5 border rounded-xl text-xs font-bold transition-all bg-white text-slate-600 hover:bg-slate-50 border-slate-300 shadow-sm"
          >
            策略提示：隱藏中
          </button>
        </div>
      </div>
      <div class="flex flex-col md:items-end gap-1">
        <button 
          id="export-pdf-btn"
          onclick="downloadPdfReport()" 
          disabled
          class="w-full md:w-auto px-5 py-2.5 rounded-xl font-bold text-white shadow-md transition-all bg-slate-300 cursor-not-allowed"
        >
          匯出 PDF 報告 (含對策表)
        </button>
      </div>
    </header>

    <!-- 主工作區 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
      <!-- 左側：我的資訊、新增關係人與待分配區 -->
      <div class="lg:col-span-1 space-y-3">
        <!-- 「我」的資訊 -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-blue-200">
          <h2 class="text-sm font-bold mb-2 text-blue-800">「我」的資訊 (最多6字)</h2>
          <input 
            type="text" 
            id="me-name" 
            maxlength="6" 
            oninput="handleMeChange()" 
            class="w-full px-3 py-2 bg-blue-50 border border-blue-100 rounded-lg text-xs mb-2 font-bold focus:outline-blue-500" 
            placeholder="我的姓名 *" 
          />
          <input 
            type="text" 
            id="me-title" 
            maxlength="6" 
            oninput="handleMeChange()" 
            class="w-full px-3 py-2 bg-blue-50 border border-blue-100 rounded-lg text-xs focus:outline-blue-500" 
            placeholder="我的職銜" 
          />
        </div>

        <!-- 1. 新增利害關係人 -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-sm font-bold mb-2 text-slate-700">1. 新增利害關係人 (最多6字)</h2>
          <form onsubmit="addStakeholder(event)" class="space-y-2.5">
            <input 
              type="text" 
              id="new-name" 
              maxlength="6" 
              oninput="handleNewStakeholderInput()"
              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-slate-500" 
              placeholder="姓名 *" 
              required 
            />
            <input 
              type="text" 
              id="new-title" 
              maxlength="6" 
              oninput="handleNewStakeholderInput()"
              class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-slate-500" 
              placeholder="職銜" 
            />
            <div id="form-error-msg" role="alert" class="text-red-600 bg-red-50 border border-red-200 rounded-lg px-2.5 py-1.5 text-[11px] font-bold hidden"></div>
            <button 
              type="submit" 
              id="add-btn" 
              disabled 
              class="w-full py-2 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-black disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed transition-all"
            >
              新增
            </button>
          </form>
        </div>

        <!-- 2. 待分配圖像區 -->
        <div id="pool-zone" class="bg-white/70 p-3 rounded-2xl border-2 border-dashed border-slate-300 min-h-[100px]">
          <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-2">2. 待分配圖像 (拖曳至地圖；或點選人像)</h3>
          <div id="unplaced-container" class="flex flex-wrap gap-2.5 justify-center">
            <!-- 待分配頭像將由 JS 動態生成 -->
          </div>
        </div>
      </div>

      <!-- 右側：四象限同心圓視覺地圖與對策總表 -->
      <div class="lg:col-span-3 space-y-4">
        <!-- 視覺地圖主畫布 -->
        <div 
          id="map-container" 
          
         
          class="relative bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden aspect-[4/3] min-h-[460px] w-full flex items-center justify-center select-none"
        >
          <!-- 四個角落策略提示（預設隱藏，字級 text-sm） -->
          <div id="corner-prompts" class="absolute inset-0 pointer-events-none z-0 hidden">
            <span class="absolute top-3.5 left-4 text-blue-600 text-sm font-bold opacity-60 tracking-wide">左上：目標對齊・主動回報</span>
            <span class="absolute top-3.5 right-4 text-amber-600 text-sm font-bold opacity-60 tracking-wide text-right">右上：價值共創・風險管理</span>
            <span class="absolute bottom-3.5 left-4 text-emerald-600 text-sm font-bold opacity-60 tracking-wide">左下：賦能支持・情感維繫</span>
            <span class="absolute bottom-3.5 right-4 text-slate-600 text-sm font-bold opacity-60 tracking-wide text-right">右下：穩定預期・資訊同步</span>
          </div>

          <!-- 三層暖橘色同心圓（100% 周邊、75% 中度、25% 核心）：直徑以畫布較短邊為準，由 JS 設定 #rings-wrap 尺寸，圓環與距離判定共用同一組半徑 -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
            <div id="rings-wrap" class="relative" style="width:100%;height:100%;">
              <div class="absolute rounded-full bg-orange-100/35 border border-orange-200/30" style="left:0;top:0;width:100%;height:100%;"></div>
              <div class="absolute rounded-full bg-orange-200/40 border border-orange-300/40" style="left:12.5%;top:12.5%;width:75%;height:75%;"></div>
              <div class="absolute rounded-full bg-orange-300/50 border border-orange-400/50" style="left:37.5%;top:37.5%;width:25%;height:25%;"></div>
            </div>
          </div>

          <!-- 座標十字軸線 -->
          <div class="absolute top-1/2 left-0 right-0 h-px bg-slate-400/40 z-10"></div>
          <div class="absolute left-1/2 top-0 bottom-0 w-px bg-slate-400/40 z-10"></div>

          <!-- X/Y 軸標籤（字級放大為 text-sm，清晰易讀） -->
          <div class="absolute top-2 left-0 right-0 flex justify-center pointer-events-none z-20">
            <span class="bg-white/95 px-3.5 py-1.5 rounded-full shadow-sm text-sm font-bold text-blue-700 border border-blue-100 tracking-wide">資源｜籌碼較多</span>
          </div>
          <div class="absolute bottom-2 left-0 right-0 flex justify-center pointer-events-none z-20">
            <span class="bg-white/95 px-3.5 py-1.5 rounded-full shadow-sm text-sm font-bold text-emerald-700 border border-emerald-100 tracking-wide">資源｜籌碼較少</span>
          </div>
          <div class="absolute left-2 top-1/2 -translate-y-1/2 pointer-events-none z-20">
            <span class="bg-white/95 px-2.5 py-3 rounded-xl shadow-sm text-sm font-bold text-slate-700 border border-slate-200 flex flex-col items-center tracking-wider gap-0.5">
              <span>內</span><span>部</span><span>關</span><span>係</span><span>人</span>
            </span>
          </div>
          <div class="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none z-20">
            <span class="bg-white/95 px-2.5 py-3 rounded-xl shadow-sm text-sm font-bold text-slate-700 border border-slate-200 flex flex-col items-center tracking-wider gap-0.5">
              <span>外</span><span>部</span><span>關</span><span>係</span><span>人</span>
            </span>
          </div>

          <!-- 地圖正中心「我」 -->
          <div class="absolute inset-0 flex items-center justify-center z-[100] pointer-events-none">
            <div class="w-14 h-14 bg-blue-600 rounded-full border-4 border-white shadow-xl flex items-center justify-center text-white font-black text-lg">
              我
            </div>
          </div>

          <!-- 已放置之利害關係人節點容器 -->
          <div id="placed-nodes-container" class="absolute inset-0 pointer-events-auto z-[250]"></div>
        </div>

        <!-- 溝通行動對策總表 -->
        <div id="table-card" class="bg-white p-4 rounded-3xl shadow-xl border border-slate-200 overflow-x-auto hidden">
          <h3 class="text-base font-black text-slate-800 mb-3 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
            利害關係人・溝通行動對策總表
          </h3>
          <table class="w-full text-left text-xs border-collapse min-w-[580px]">
            <thead>
              <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
                <th class="py-2.5 px-2 font-bold">對象與職稱</th>
                <th class="py-2.5 px-2 font-bold">位置與向度說明</th>
                <th class="py-2.5 px-2 font-bold">核心態度與策略方針</th>
                <th class="py-2.5 px-2 font-bold">建議頻率與互動管道</th>
                <th class="py-2.5 px-2 font-bold">對話方式參考</th>
              </tr>
            </thead>
            <tbody id="strategy-tbody" class="divide-y divide-slate-100">
              <!-- 表格列將由 JS 動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 點選人像的操作選單 -->
  <div id="action-modal" class="fixed inset-0 z-[450] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 hidden" onclick="if(event.target===this) closeActionModal()" role="dialog" aria-modal="true" aria-labelledby="action-title">
    <div class="bg-white rounded-3xl shadow-2xl w-full p-5 max-w-xs">
      <div class="flex justify-between items-start mb-3">
        <div class="min-w-0">
          <h3 id="action-title" class="text-base font-bold text-slate-800 break-words"></h3>
          <p id="action-subtitle" class="text-xs text-slate-400 mt-0.5 break-words"></p>
        </div>
        <button type="button" onclick="closeActionModal()" class="text-slate-400 font-bold text-xl hover:text-slate-600 leading-none px-1" aria-label="關閉">×</button>
      </div>
      <div class="space-y-3">
        <button type="button" onclick="actionEdit()" class="w-full py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-200">編輯姓名／職銜</button>
        <div>
          <div id="action-place-label" class="text-[11px] font-bold text-slate-400 mb-1.5"></div>
          <div id="action-place-grid" class="grid grid-cols-2 gap-2"></div>
        </div>
        <button type="button" id="action-unplace" onclick="actionUnplace()" class="w-full py-2.5 bg-white text-slate-600 border border-slate-200 rounded-xl font-bold text-xs hover:bg-slate-50">移回待分配區</button>
        <button type="button" id="action-delete" onclick="actionDelete()" class="w-full py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-xl font-bold text-xs hover:bg-red-100">刪除</button>
      </div>
    </div>
  </div>

  <!-- 雙擊編輯彈窗 -->
  <div id="edit-modal" class="fixed inset-0 z-[400] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 hidden">
    <div class="bg-white rounded-3xl shadow-2xl w-full p-6 max-w-sm">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-slate-800">編輯利害關係人 (最多6字)</h3>
        <button onclick="closeEditModal()" class="text-slate-400 font-bold text-xl hover:text-slate-600">×</button>
      </div>
      <form onsubmit="saveEditedStakeholder(event)" class="space-y-3">
        <input type="hidden" id="edit-id" />
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase">姓名 *</label>
          <input type="text" id="edit-name" maxlength="6" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold mt-1 focus:outline-blue-500" required />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase">職銜</label>
          <input type="text" id="edit-title" maxlength="6" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs mt-1 focus:outline-blue-500" />
        </div>
        <div id="edit-error-msg" class="text-red-500 text-[10px] font-bold hidden"></div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs hover:bg-slate-200">取消</button>
          <button type="submit" class="flex-1 py-2 bg-blue-600 text-white rounded-xl font-bold text-xs hover:bg-blue-700">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 通知與 PDF 提示彈窗 -->
  <div id="notice-modal" class="fixed inset-0 z-[500] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
    <div class="bg-white rounded-3xl shadow-2xl w-full p-6 max-w-sm text-center">
      <h3 class="text-base font-bold text-slate-800 mb-2">通知</h3>
      <p id="notice-message" class="text-xs text-slate-600 leading-relaxed mb-4"></p>
      <div id="notice-actions" class="space-y-2 mb-2 hidden"></div>
      <button onclick="closeNoticeModal()" class="w-full py-2 bg-slate-200 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-300">關閉</button>
    </div>
  </div>

  <script>
    // 程式最後發布/建置版本時間（格式：yymmdd-HHmm）
    const APP_BUILD_TIMESTAMP = '261013-1600';

    // 6 組飽和清晰主題配色
    const STAKEHOLDER_THEMES = [
      { color: '#2563EB', bg: '#EFF6FF', border: '#BFDBFE' },
      { color: '#059669', bg: '#ECFDF5', border: '#A7F3D0' },
      { color: '#D97706', bg: '#FFFBEB', border: '#FDE68A' },
      { color: '#7C3AED', bg: '#F5F3FF', border: '#DDD6FE' },
      { color: '#DC2626', bg: '#FEF2F2', border: '#FECACA' },
      { color: '#DB2777', bg: '#FDF2F8', border: '#FBCFE8' }
    ];

    // 使用者提供的 4 象限完整對話資料庫（16 組情境與對話模板）
    const stakeholderDialogueLibrary = {
      Q1: {
        quadrant: "內部高籌碼",
        quadrantName: "左上",
        tag: "目標對齊・主動回報",
        tagColor: "bg-blue-100 text-blue-800 border-blue-200",
        coreAttitudes: [
          "積極透明，主動承擔",
          "先說結論，再補充依據",
          "預先提出選項與風險"
        ],
        strategyFocus: [
          "將專案目標連結到主管目標",
          "及早請示需要決策的事項",
          "讓主管看見資源需求與預期效益"
        ],
        interactionOptions: [
          {
            tier: "core",
            scenario: "需要主管決策",
            frequency: "重大決策前，或每兩週一次",
            channels: "一對一決策會議＋一頁摘要",
            prompt: "主管，{{專案名稱}}目前已完成{{進度}}。下一步需要決定{{決策事項}}，我整理了兩個方案與各自影響，建議您優先考量{{建議方向}}。"
          },
          {
            tier: "core",
            scenario: "出現重大風險",
            frequency: "發現當日",
            channels: "即時電話或面談＋書面摘要",
            prompt: "主管，目前出現{{風險事件}}，若不處理，可能影響{{影響事項}}。我建議先採取{{暫行作法}}，並請您確認是否同意{{需請示事項}}。"
          },
          {
            tier: "standard",
            scenario: "例行進度同步",
            frequency: "每週一次",
            channels: "週報＋重點進度會議",
            prompt: "主管，本週{{專案名稱}}完成{{進度}}；目前卡點是{{卡點}}。下週將完成{{下一步}}，如方向需要調整，請您指示。"
          },
          {
            tier: "standard",
            scenario: "爭取資源",
            frequency: "資源缺口確認後",
            channels: "資源申請摘要＋簡短會議",
            prompt: "為完成{{目標}}，目前仍缺少{{資源}}。若能在{{日期}}前取得支援，預計可帶來{{效益}}；若無法補足，可能影響{{風險}}。"
          }
        ]
      },
      Q2: {
        quadrant: "外部高籌碼",
        quadrantName: "右上",
        tag: "價值共創・風險管理",
        tagColor: "bg-amber-100 text-amber-800 border-amber-200",
        coreAttitudes: [
          "尊重對方決策權與商業考量",
          "先確認共同利益，再談需求",
          "重要承諾、時程與責任都要說清楚"
        ],
        strategyFocus: [
          "找出雙方共同目標",
          "事前釐清責任、風險與交付標準",
          "維持專業、正式且可追溯的溝通"
        ],
        interactionOptions: [
          {
            tier: "core",
            scenario: "合作啟動或重大協商",
            frequency: "合作開始前",
            channels: "高階對齊會議＋正式會議紀錄",
            prompt: "為讓{{專案名稱}}同時符合雙方目標，我們理解貴方最在意的是{{對方目標}}。建議先確認{{共同成果}}、{{責任分工}}與{{重要時程}}。"
          },
          {
            tier: "core",
            scenario: "合作出現重大變動",
            frequency: "變動確認後立即",
            channels: "正式信函或電話＋會議確認",
            prompt: "因{{變動原因}}，原訂{{事項}}可能受到影響。我方提出{{調整方案}}，希望與貴方確認可接受範圍及後續責任安排。"
          },
          {
            tier: "standard",
            scenario: "例行合作推進",
            frequency: "每兩週或每月一次",
            channels: "專案協調會＋進度摘要",
            prompt: "本期已完成{{進度}}，下一階段將進行{{下一步}}。請貴方協助確認{{需配合事項}}，以維持雙方原訂時程。"
          },
          {
            tier: "standard",
            scenario: "確認交付或驗收",
            frequency: "交付前一週",
            channels: "交付清單＋正式確認信",
            prompt: "本次預計交付{{成果}}，內容包含{{項目}}。為避免後續認知不同，請貴方於{{日期}}前確認驗收方式與完成標準。"
          }
        ]
      },
      Q3: {
        quadrant: "內部低籌碼",
        quadrantName: "左下",
        tag: "賦能支持・情感維繫",
        tagColor: "bg-emerald-100 text-emerald-800 border-emerald-200",
        coreAttitudes: [
          "先理解現場困難，再提出要求",
          "肯定貢獻，協助排除障礙",
          "讓對方清楚知道可獲得何種支持"
        ],
        strategyFocus: [
          "取得第一線資訊與真實回饋",
          "降低執行阻力與不必要負擔",
          "建立願意主動回報問題的安全感"
        ],
        interactionOptions: [
          {
            tier: "core",
            scenario: "專案卡關或急需支援",
            frequency: "每日短暫確認",
            channels: "即時訊息＋10分鐘站立會議",
            prompt: "目前最影響{{專案名稱}}的是{{卡點}}。你們先專注處理{{優先事項}}，跨單位協調與資源問題由我來處理；還有哪些困難需要我協助？"
          },
          {
            tier: "core",
            scenario: "蒐集第一線回饋",
            frequency: "變更上線前與上線後",
            channels: "短訪談＋回饋表單",

          },

          },
          {
            tier: "standard",
            scenario: "肯定與調整回饋",
            frequency: "任務完成後或重要節點",
            channels: "一對一回饋或小組會議",
            prompt: "這次你在{{具體行為}}做得很好，特別幫助了{{成果}}。下一次若能再留意{{改善事項}}，整體效果會更完整；需要我提供什麼支持？"
          }
        ]
      },
      Q4: {
        quadrant: "外部低籌碼",
        quadrantName: "右下",
        tag: "穩定預期・資訊同步",
        tagColor: "bg-slate-100 text-slate-800 border-slate-200",
        coreAttitudes: [

        ],
        strategyFocus: [
          "確認交付內容與責任界線",
          "及早掌握落後或偏差情況",
          "以固定節奏降低資訊落差"
        ],
        interactionOptions: [
          {
            tier: "core",
            scenario: "任務交付或規格確認",
            frequency: "合作開始前",
            channels: "工作說明單＋確認信",
            prompt: "本次需要貴方於{{日期}}前完成{{交付內容}}，完成標準為{{標準}}。若有資源或時程困難，請於{{回覆日期}}前提出。"
          },
          {
            tier: "core",
            scenario: "交付可能延誤",
            frequency: "發現當日",
            channels: "電話或即時訊息＋書面確認",
            prompt: "目前發現{{事項}}可能無法依原訂時間完成。請今天{{時間}}前回覆實際完成日、原因，以及可採取的補救作法。"
          },
          {
            tier: "standard",
            scenario: "例行進度同步",
            frequency: "每週一次或依專案節點",
            channels: "共享進度表＋電子郵件",
            prompt: "提醒目前進度已進入{{階段}}。請依原訂時程更新{{項目}}，如規格有不清楚之處，請先提出確認，不要自行假設。"
          },
          {
            tier: "standard",
            scenario: "完成確認與後續合作",
            frequency: "每次交付後",
            channels: "驗收清單＋結案確認信",
            prompt: "已收到本次{{交付內容}}。我們將依{{驗收標準}}確認結果；若有需調整之處，會於{{日期}}前彙整回覆。"
          }
        ]
      }
    };

    // 全域狀態
    let meData = { name: '', title: '' };
    let stakeholders = [];
    let showWatermark = false; // 初始預設關閉
    let draggedId = null;
    let liveDraggingId = null;
    const MAX_STAKEHOLDERS = 6;

    // 時間戳記格式：yymmdd-HHmm
    function getFormattedTimestamp() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const HH = String(now.getHours()).padStart(2, '0');
      const MM = String(now.getMinutes()).padStart(2, '0');
      return `${yy}${mm}${dd}-${HH}${MM}`;
    }

    // 產生純白不透明底色 Avatar SVG
    function createAvatarSvg(color, size = 48) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="31" fill="#ffffff" stroke="${color}" stroke-width="4" />
          <circle cx="32" cy="24" r="11" fill="${color}" fill-opacity="0.35" stroke="${color}" stroke-width="3" />
          <path d="M12 50C12 40.0589 20.9543 33 32 33C43.0457 33 52 40.0589 52 50" stroke="${color}" stroke-width="3.5" stroke-linecap="round" />
        </svg>
      `;
    }

    // 工具：HTML 跳脫（人物姓名／職銜會插入 innerHTML）
    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ===== 地圖幾何：圓環與距離判定共用同一組半徑（以較短邊為直徑）=====
    function getMapMetrics() {
      const rect = document.getElementById('map-container').getBoundingClientRect();
      return { rect, W: rect.width, H: rect.height, R: Math.min(rect.width, rect.height) / 2 };
    }

    function updateRings() {
      const { W, H } = getMapMetrics();
      const d = Math.min(W, H);
      const wrap = document.getElementById('rings-wrap');
      if (wrap && d > 0) {
        wrap.style.width = d + 'px';
        wrap.style.height = d + 'px';
      }
    }

    // 象限與距離計算邏輯
    function getQuadrantKey(x, y) {
      if (x === null || y === null) return null;
      if (x < 50 && y < 50) return 'Q1';
      if (x >= 50 && y < 50) return 'Q2';
      if (x < 50 && y >= 50) return 'Q3';
      return 'Q4';
    }

    function getPositionInfo(x, y) {
      if (x === null || y === null) return null;
      const qKey = getQuadrantKey(x, y);
      const qStrategy = qKey ? stakeholderDialogueLibrary[qKey] : null;

      // x、y 為相對於畫布寬／高的百分比，先換算成像素再與圓環半徑比較
      const { W, H, R } = getMapMetrics();
      const dx = ((x - 50) / 100) * W;
      const dy = ((y - 50) / 100) * H;
      const normalizedDistance = R > 0 ? Math.min(100, Math.round((Math.hypot(dx, dy) / R) * 100)) : 100;

      let tierName = '', tierColor = '', isCore = false;
      if (normalizedDistance <= 25) {
        tierName = '核心 (≦25%)';
        tierColor = 'text-red-700 bg-red-100 border-red-200';
        isCore = true;
      } else if (normalizedDistance <= 75) {
        tierName = '中度 (26%-75%)';
        tierColor = 'text-amber-700 bg-amber-100 border-amber-200';
      } else {
        tierName = '周邊 (76%-100%)';
        tierColor = 'text-blue-700 bg-blue-100 border-blue-200';
      }

      return { quadrantKey: qKey, quadrantName: qStrategy?.quadrantName || '未定', normalizedDistance, tierName, tierColor, isCore };
    }

    // 將模板中的 {{變數}} 轉換為：無括號、字級放大1級、粗體、底線，且顏色與對應角色顏色相同
    function formatDialoguePrompt(rawText, highlightColor = '#2563EB') {
      if (!rawText) return '';
      return rawText.replace(
        /\{\{([^}]+)\}\}/g,
        `<span class="text-sm font-black underline decoration-2 underline-offset-2 mx-0.5" style="color: ${highlightColor}; text-decoration-color: ${highlightColor};">$1</span>`
      );
    }

    // 對策選擇：以「人物自己的 themeIndex」固定輪替，不再受同象限其他人進出影響；
    // 使用者可在對策表中手動切換情境（s.scenarioPick），切換後會被記住（僅在同一象限有效）。
    function getStrategyData(s, pos, themeColor = '#2563EB') {
      const qKey = pos?.quadrantKey;
      if (!qKey || !stakeholderDialogueLibrary[qKey]) return null;
      const bank = stakeholderDialogueLibrary[qKey];
      const seed = Number.isInteger(s.themeIndex) ? s.themeIndex : 0;

      // 1. 互動情境：優先使用手動選擇；否則在符合層級（core / standard）的情境中依 seed 固定挑選
      const targetTier = pos.isCore ? 'core' : 'standard';
      const matched = bank.interactionOptions.filter(item => item.tier === targetTier);
      const pool = matched.length ? matched : bank.interactionOptions;
      let chosenOption = null;
      if (s.scenarioPick && s.scenarioPick.qKey === qKey) {
        chosenOption = bank.interactionOptions.find(o => o.scenario === s.scenarioPick.scenario) || null;
      }
      if (!chosenOption) chosenOption = pool[seed % pool.length];

      // 2. 核心態度與方針：同樣依 seed 固定
      const chosenAttitude = bank.coreAttitudes[seed % bank.coreAttitudes.length];
      const chosenFocus = bank.strategyFocus[(seed + 1) % bank.strategyFocus.length];

      return {
        quadrant: bank.quadrant,
        quadrantName: bank.quadrantName,
        tag: bank.tag,
        tagColor: bank.tagColor,
        coreAttitude: chosenAttitude,
        strategyFocus: chosenFocus,
        scenario: chosenOption.scenario,
        scenarioOptions: bank.interactionOptions.map(o => o.scenario),
        frequency: chosenOption.frequency,
        channels: chosenOption.channels,
        promptFormatted: formatDialoguePrompt(chosenOption.prompt, themeColor)
      };
    }

    function setScenario(id, scenario) {
      const s = stakeholders.find(item => item.id === id);
      if (!s) return;
      const qKey = getQuadrantKey(s.x, s.y);
      if (!qKey) return;
      s.scenarioPick = { qKey, scenario };
      render();
    }

    function handleMeChange() {
      meData.name = document.getElementById('me-name').value.slice(0, 6);
      meData.title = document.getElementById('me-title').value.slice(0, 6);
      if (meData.name.trim()) {
        document.getElementById('me-name').classList.remove('ring-2', 'ring-red-400', 'border-red-400');
        document.getElementById('form-error-msg').classList.add('hidden');
      }
      updateAddButtonState();
    }

    function handleNewStakeholderInput() {
      const errorEl = document.getElementById('form-error-msg');
      if (errorEl) errorEl.classList.add('hidden');
      updateAddButtonState();
    }

    function updateAddButtonState() {
      const addBtn = document.getElementById('add-btn');
      const newName = (document.getElementById('new-name')?.value || '').trim();
      const notFull = stakeholders.length < MAX_STAKEHOLDERS;
      // 只要利害關係人姓名有填寫且人數未達 6 人即可點擊新增
      addBtn.disabled = !(newName.length > 0 && notFull);
    }

    function addStakeholder(e) {
      e.preventDefault();
      const nameInput = document.getElementById('new-name');
      const titleInput = document.getElementById('new-title');
      const errorEl = document.getElementById('form-error-msg');
      const meNameInput = document.getElementById('me-name');
      const name = nameInput.value.trim().slice(0, 6);
      const title = titleInput.value.trim().slice(0, 6);

      if (!name) return;

      // 若尚未填寫「我的姓名」，自動聚焦並提示
      if (!meData.name.trim()) {
        errorEl.textContent = '尚未新增：請先填寫上方的「我的姓名」，再按「新增」（已輸入的內容會保留）';
        errorEl.classList.remove('hidden');
        meNameInput.classList.add('ring-2', 'ring-red-400', 'border-red-400');
        meNameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        meNameInput.focus({ preventScroll: true });
        return;
      }

      const isDuplicate = stakeholders.some(s => s.name === name && s.title === title) ||
                          (meData.name === name && meData.title === title);
      if (isDuplicate) {
        errorEl.textContent = '姓名與職銜組合不能重複';
        errorEl.classList.remove('hidden');
        return;
      }
      errorEl.classList.add('hidden');

      const usedIndices = stakeholders.map(s => s.themeIndex);
      const nextThemeIndex = [0, 1, 2, 3, 4, 5].find(idx => !usedIndices.includes(idx)) ?? (stakeholders.length % STAKEHOLDER_THEMES.length);

      stakeholders.push({
        id: Date.now().toString(),
        name,
        title,
        x: null,
        y: null,
        isPlaced: false,
        themeIndex: nextThemeIndex
      });

      nameInput.value = '';
      titleInput.value = '';
      render();
    }

    function removeStakeholder(id) {
      stakeholders = stakeholders.filter(s => s.id !== id);
      render();
    }

    function toggleWatermark() {
      showWatermark = !showWatermark;
      const btn = document.getElementById('toggle-watermark-btn');
      const prompts = document.getElementById('corner-prompts');
      if (showWatermark) {
        btn.textContent = '策略提示：顯示中';
        btn.className = 'px-3.5 py-1.5 border rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-sm border-blue-600';
        prompts.classList.remove('hidden');
      } else {
        btn.textContent = '策略提示：隱藏中';
        btn.className = 'px-3.5 py-1.5 border rounded-xl text-xs font-bold transition-all bg-white text-slate-600 hover:bg-slate-50 border-slate-300 shadow-sm';
        prompts.classList.add('hidden');
      }
    }

    // ===== 統一拖曳：Pointer Events（滑鼠／觸控／手寫筆共用）=====
    // 拖曳期間只移動浮動的「影子」，不重建 DOM，因此觸控不會中斷；放開時才一次更新狀態。
    const DRAG_THRESHOLD = 6;
    let dragState = null;
    let autoScrollRaf = null;

    function startPointerDrag(e, id) {
      if (dragState) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const s = stakeholders.find(item => item.id === id);
      if (!s) return;
      e.preventDefault();
      dragState = { id, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, lastX: e.clientX, lastY: e.clientY, moved: false, ghost: null, srcEl: e.currentTarget };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerCancel);
    }

    function createDragGhost(s) {
      const theme = STAKEHOLDER_THEMES[s.themeIndex] || STAKEHOLDER_THEMES[0];
      const el = document.createElement('div');
      el.className = 'fixed left-0 top-0 z-[600] pointer-events-none flex flex-col items-center';
      el.style.willChange = 'transform';
      el.innerHTML = `
        <div class="p-0.5 bg-white rounded-full shadow-xl border-2 border-blue-500">${createAvatarSvg(theme.color, 48)}</div>
        <div class="mt-[-2px] bg-white/95 px-2.5 py-0.5 rounded-full shadow border border-slate-100 text-[11px] font-bold whitespace-nowrap">${esc(s.name)}</div>
      `;
      document.body.appendChild(el);
      return el;
    }

    function moveGhost(x, y) {
      if (dragState?.ghost) dragState.ghost.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    }

    function pointInRect(x, y, r) {
      return !!r && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    }

    function updateDropHighlight() {
      if (!dragState) return;
      const map = document.getElementById('map-container');
      const pool = document.getElementById('pool-zone');
      const s = stakeholders.find(item => item.id === dragState.id);
      const overMap = pointInRect(dragState.lastX, dragState.lastY, map.getBoundingClientRect());
      const overPool = !!(s && s.isPlaced) && pointInRect(dragState.lastX, dragState.lastY, pool.getBoundingClientRect());
      map.classList.toggle('ring-4', overMap);
      map.classList.toggle('ring-blue-300', overMap);
      pool.classList.toggle('ring-2', overPool);
      pool.classList.toggle('ring-blue-400', overPool);
    }

    // 拖到畫面上下緣時自動捲動（手機版地圖在待分配區下方，需要靠這個才拖得到）
    function autoScrollLoop() {
      if (!dragState || !dragState.moved) { autoScrollRaf = null; return; }
      const edge = 70, y = dragState.lastY;
      let dy = 0;
      if (y < edge) dy = -Math.ceil((edge - y) / 6);
      else if (y > window.innerHeight - edge) dy = Math.ceil((y - (window.innerHeight - edge)) / 6);
      if (dy) { window.scrollBy(0, dy); updateDropHighlight(); }
      autoScrollRaf = requestAnimationFrame(autoScrollLoop);
    }

    function onPointerMove(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      dragState.lastX = e.clientX;
      dragState.lastY = e.clientY;
      if (!dragState.moved) {
        if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) < DRAG_THRESHOLD) return;
        const s = stakeholders.find(item => item.id === dragState.id);
        if (!s) return cleanupDrag();
        dragState.moved = true;
        dragState.ghost = createDragGhost(s);
        if (dragState.srcEl) dragState.srcEl.style.opacity = '0.35';
        autoScrollRaf = requestAnimationFrame(autoScrollLoop);
      }
      moveGhost(e.clientX, e.clientY);
      updateDropHighlight();
      if (e.cancelable) e.preventDefault();
    }

    function cleanupDrag() {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerCancel);
      if (autoScrollRaf) { cancelAnimationFrame(autoScrollRaf); autoScrollRaf = null; }
      if (dragState?.ghost) dragState.ghost.remove();
      if (dragState?.srcEl) dragState.srcEl.style.opacity = '';
      const map = document.getElementById('map-container');
      const pool = document.getElementById('pool-zone');
      map.classList.remove('ring-4', 'ring-blue-300');
      pool.classList.remove('ring-2', 'ring-blue-400');
      dragState = null;
    }

    function onPointerCancel(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      cleanupDrag();
    }

    function onPointerUp(e) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      const { id, moved } = dragState;
      const x = e.clientX, y = e.clientY;
      cleanupDrag();

      const s = stakeholders.find(item => item.id === id);
      if (!s) return;

      // 沒有明顯位移 = 點一下 → 開啟操作選單
      if (!moved) { openActionModal(id); return; }

      const mapRect = document.getElementById('map-container').getBoundingClientRect();
      const poolRect = document.getElementById('pool-zone').getBoundingClientRect();

      if (pointInRect(x, y, mapRect)) {
        s.x = Math.max(5, Math.min(95, ((x - mapRect.left) / mapRect.width) * 100));
        s.y = Math.max(5, Math.min(95, ((y - mapRect.top) / mapRect.height) * 100));
        s.isPlaced = true;
      } else if (s.isPlaced && pointInRect(x, y, poolRect)) {
        s.x = null; s.y = null; s.isPlaced = false;
      }
      // 放在其他地方 → 取消，維持原狀
      render();
    }

    // ===== 點選人像的操作選單（觸控裝置也能編輯／刪除／移動）=====
    let actionTargetId = null;
    let deleteArmed = false;
    const QUICK_BASE = { Q1: { x: 27, y: 27 }, Q2: { x: 73, y: 27 }, Q3: { x: 27, y: 73 }, Q4: { x: 73, y: 73 } };

    function openActionModal(id) {
      const s = stakeholders.find(item => item.id === id);
      if (!s) return;
      actionTargetId = id;
      deleteArmed = false;
      document.getElementById('action-title').textContent = s.name;
      document.getElementById('action-subtitle').textContent = s.title ? s.title : '（未填職銜）';
      document.getElementById('action-place-label').textContent = s.isPlaced ? '移動到象限' : '快速放置到象限';
      document.getElementById('action-unplace').classList.toggle('hidden', !s.isPlaced);
      const delBtn = document.getElementById('action-delete');
      delBtn.textContent = '刪除';
      delBtn.className = 'w-full py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-xl font-bold text-xs hover:bg-red-100';
      document.getElementById('action-place-grid').innerHTML = ['Q1', 'Q2', 'Q3', 'Q4'].map(q => {
        const b = stakeholderDialogueLibrary[q];
        return `<button type="button" onclick="actionQuickPlace('${q}')" class="border rounded-xl py-2 px-1 text-center ${b.tagColor}">
          <span class="block text-xs font-bold">${b.quadrantName}</span>
          <span class="block text-[10px] opacity-80">${b.tag}</span>
        </button>`;
      }).join('');
      document.getElementById('action-modal').classList.remove('hidden');
    }

    function closeActionModal() {
      document.getElementById('action-modal').classList.add('hidden');
      actionTargetId = null;
      deleteArmed = false;
    }

    function actionEdit() {
      const id = actionTargetId;
      closeActionModal();
      if (id) openEditModal(id);
    }

    function actionUnplace() {
      const s = stakeholders.find(item => item.id === actionTargetId);
      if (s) { s.x = null; s.y = null; s.isPlaced = false; }
      closeActionModal();
      render();
    }

    function actionQuickPlace(qKey) {
      const s = stakeholders.find(item => item.id === actionTargetId);
      if (!s || !QUICK_BASE[qKey]) return;
      const n = stakeholders.filter(o => o.isPlaced && o.id !== s.id && getQuadrantKey(o.x, o.y) === qKey).length;
      const base = QUICK_BASE[qKey];
      const ox = ((n % 3) - 1) * 9;
      const oy = Math.floor(n / 3) * 9 * (base.y < 50 ? 1 : -1);
      s.x = Math.max(5, Math.min(95, base.x + ox));
      s.y = Math.max(5, Math.min(95, base.y + oy));
      s.isPlaced = true;
      closeActionModal();
      render();
    }

    function actionDelete() {
      const btn = document.getElementById('action-delete');
      if (!deleteArmed) {
        deleteArmed = true;
        btn.textContent = '再按一次確認刪除';
        btn.className = 'w-full py-2.5 bg-red-600 text-white border border-red-600 rounded-xl font-bold text-xs hover:bg-red-700';
        return;
      }
      const id = actionTargetId;
      closeActionModal();
      if (id) removeStakeholder(id);
    }

    // Esc 關閉最上層視窗 / 取消拖曳
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (dragState) { cleanupDrag(); return; }
      const open = id => !document.getElementById(id).classList.contains('hidden');
      if (open('notice-modal')) closeNoticeModal();
      else if (open('edit-modal')) closeEditModal();
      else if (open('action-modal')) closeActionModal();
    });

    // 雙擊編輯視窗
    function openEditModal(id) {
      const s = stakeholders.find(item => item.id === id);
      if (!s) return;
      document.getElementById('edit-id').value = s.id;
      document.getElementById('edit-name').value = s.name;
      document.getElementById('edit-title').value = s.title || '';
      document.getElementById('edit-error-msg').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function saveEditedStakeholder(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim().slice(0, 6);
      const title = document.getElementById('edit-title').value.trim().slice(0, 6);
      const errorEl = document.getElementById('edit-error-msg');

      const isDuplicate = stakeholders.some(s => s.id !== id && s.name === name && s.title === title) ||
                          (meData.name === name && meData.title === title);
      if (isDuplicate) {
        errorEl.textContent = '姓名與職銜組合不能重複';
        errorEl.classList.remove('hidden');
        return;
      }

      const s = stakeholders.find(item => item.id === id);
      if (s) {
        s.name = name;
        s.title = title;
      }
      closeEditModal();
      render();
    }

    // 提示彈窗
    function showNotice(msg, actions = null) {
      document.getElementById('notice-message').textContent = msg;
      const actionsEl = document.getElementById('notice-actions');
      if (actions) {
        actionsEl.innerHTML = actions;
        actionsEl.classList.remove('hidden');
      } else {
        actionsEl.classList.add('hidden');
      }
      document.getElementById('notice-modal').classList.remove('hidden');
    }

    function closeNoticeModal() {
      document.getElementById('notice-modal').classList.add('hidden');
    }

    function nodeKeyHandler(id) {
      return `if(event.key==='Enter'||event.key===' '){event.preventDefault();openActionModal('${id}')}`;
    }

    function renderNodesOnly() {
      const placedContainer = document.getElementById('placed-nodes-container');
      const placed = stakeholders.filter(s => s.isPlaced);

      placedContainer.innerHTML = placed.map(s => {
        const theme = STAKEHOLDER_THEMES[s.themeIndex] || STAKEHOLDER_THEMES[0];
        const pos = getPositionInfo(s.x, s.y);
        const strategy = getStrategyData(s, pos, theme.color);
        const label = s.title ? `${s.name}（${s.title}）` : s.name;

        return `
          <div
            tabindex="0" role="button"
            aria-label="${esc(label)}：點一下開啟選單，按住可拖曳移動"
            style="left: ${s.x}%; top: ${s.y}%; transform: translate(-50%, -50%);"
            class="absolute flex flex-col items-center cursor-grab active:cursor-grabbing touch-none group outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded-2xl"
            onpointerdown="startPointerDrag(event, '${s.id}')"
            onkeydown="${nodeKeyHandler(s.id)}"
          >
            <div class="relative p-0.5 bg-white rounded-full shadow-lg border-2 border-transparent group-hover:border-blue-500">
              ${createAvatarSvg(theme.color, 48)}
            </div>
            <div class="mt-[-2px] text-center pointer-events-none flex flex-col items-center z-[310]">
              <div class="bg-white/95 px-2.5 py-0.5 rounded-full shadow border border-slate-100 text-[11px] font-bold flex items-center gap-1 whitespace-nowrap">
                <span class="text-slate-900">${esc(s.name)}</span>
                ${s.title ? `<span class="text-slate-400 font-normal text-[10px]">(${esc(s.title)})</span>` : ''}
              </div>
              ${strategy ? `<div class="px-2 py-0.5 rounded-full border text-[9px] font-bold mt-0.5 ${strategy.tagColor}">${strategy.tag}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      updateAddButtonState();

      // 1. 待分配頭像
      const unplacedContainer = document.getElementById('unplaced-container');
      const unplaced = stakeholders.filter(s => !s.isPlaced);
      unplacedContainer.innerHTML = unplaced.map(s => {
        const theme = STAKEHOLDER_THEMES[s.themeIndex] || STAKEHOLDER_THEMES[0];
        const label = s.title ? `${s.name}（${s.title}）` : s.name;
        return `
          <div
            tabindex="0" role="button"
            aria-label="${esc(label)}：點一下開啟選單，按住可拖曳到地圖"
            onpointerdown="startPointerDrag(event, '${s.id}')"
            onkeydown="${nodeKeyHandler(s.id)}"
            class="flex flex-col items-center cursor-grab touch-none p-1 rounded-xl outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          >
            ${createAvatarSvg(theme.color, 40)}
            <span class="text-[10px] font-bold mt-1 text-slate-700">${esc(s.name)}</span>
          </div>
        `;
      }).join('');

      // 2. 地圖上的節點
      renderNodesOnly();

      // 3. 匯出按鈕與表格狀態
      const placed = stakeholders.filter(s => s.isPlaced);
      const exportBtn = document.getElementById('export-pdf-btn');
      const tableCard = document.getElementById('table-card');
      const strategyTbody = document.getElementById('strategy-tbody');

      if (placed.length > 0) {
        exportBtn.disabled = false;
        exportBtn.className = 'w-full md:w-auto px-5 py-2.5 rounded-xl font-bold text-white shadow-md transition-all bg-blue-600 hover:bg-blue-700 active:scale-95 cursor-pointer';
        tableCard.classList.remove('hidden');

        strategyTbody.innerHTML = placed.map(s => {
          const theme = STAKEHOLDER_THEMES[s.themeIndex] || STAKEHOLDER_THEMES[0];
          const pos = getPositionInfo(s.x, s.y);
          const strategy = getStrategyData(s, pos, theme.color);

          const scenarioControl = strategy ? `
            <select data-scenario aria-label="切換 ${esc(s.name)} 的互動情境"
              onchange="setScenario('${s.id}', this.value)"
              class="max-w-full mb-1.5 px-1.5 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 rounded border border-blue-200 cursor-pointer">
              ${strategy.scenarioOptions.map(o => `<option value="${esc(o)}" ${o === strategy.scenario ? 'selected' : ''}>情境：${esc(o)}</option>`).join('')}
            </select>` : '';

          return `
            <tr class="hover:bg-blue-50/30 transition-colors">
              <td class="py-3 px-2">
                <div class="flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${theme.color};"></span>
                  <div>
                    <span class="font-extrabold text-slate-800">${esc(s.name)}</span>
                    ${s.title ? `<span class="text-slate-400 text-[10px] ml-1">(${esc(s.title)})</span>` : ''}
                  </div>
                </div>
              </td>
              <td class="py-3 px-2">
                <span class="inline-block px-2 py-0.5 rounded-full border text-[10px] font-bold ${strategy?.tagColor}">${pos?.quadrantName}</span>
                <div class="text-[10px] text-slate-400 mt-0.5">${pos?.tierName}</div>
              </td>
              <td class="py-3 px-2 text-slate-700">
                <div class="font-bold text-slate-800 leading-snug">${strategy?.coreAttitude || '積極透明'}</div>
                <div class="text-[10px] text-slate-500 mt-1 leading-snug">${strategy?.strategyFocus || ''}</div>
              </td>
              <td class="py-3 px-2 text-slate-600">
                <div class="font-semibold text-slate-800 leading-snug">${strategy?.frequency || '定期同步'}</div>
                <div class="text-[10px] text-slate-500 mt-1 leading-snug">${strategy?.channels || ''}</div>
              </td>
              <td class="py-3 px-2 bg-slate-50/80 text-slate-700 rounded-lg">
                ${scenarioControl}
                <div class="leading-relaxed text-[11px] text-slate-800">${strategy?.promptFormatted || ''}</div>
              </td>
            </tr>
          `;
        }).join('');
      } else {
        exportBtn.disabled = true;
        exportBtn.className = 'w-full md:w-auto px-5 py-2.5 rounded-xl font-bold text-white shadow-md transition-all bg-slate-300 cursor-not-allowed';
        tableCard.classList.add('hidden');
      }
    }

    // 安全渲染自訂標頭至 Canvas (避免負座標與脫離文件流的錯誤)
    async function renderDomTextToCanvas(htmlContent, widthPx = 900) {
      const container = document.createElement('div');
      container.style.width = `${widthPx}px`;
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.zIndex = '-9999';
      container.style.backgroundColor = '#ffffff';
      container.style.boxSizing = 'border-box';
      container.innerHTML = htmlContent;
      document.body.appendChild(container);

      try {
        const canvas = await window.html2canvas(container, {
          scale: 2,
          backgroundColor: '#ffffff',
          logging: false,
          useCORS: true
        });
        return canvas;
      } finally {
        document.body.removeChild(container);
      }
    }

    async function downloadPdfReport() {
      const placed = stakeholders.filter(s => s.isPlaced);
      if (placed.length === 0) return;

      const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
      if (!window.html2canvas || !jsPDFClass) {
        showNotice('PDF 匯出套件尚未載入完成，請確認網路連線或重新整理頁面。');
        return;
      }

      showNotice('正在產生高品質防截斷 PDF 報告，請稍候...');

      try {
        const pdf = new jsPDFClass({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = 210, pageHeight = 297, margin = 10, contentWidth = pageWidth - margin * 2;

        // 1. 產生正式報告主頁首
        const headerHtml = `
          <div style="padding: 10px 14px 12px 14px; border-bottom: 2px solid #cbd5e1; font-family: system-ui, -apple-system, sans-serif;">
            <div style="font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 6px; letter-spacing: -0.5px;">利害關係人・視覺地圖與溝通行動對策報告</div>
            <div style="font-size: 12px; font-weight: 600; color: #475569;">
              分析主體：${meData.name || '未填寫'} ${meData.title ? `(${meData.title})` : ''} ｜ 程式版本：v_${APP_BUILD_TIMESTAMP}
            </div>
          </div>
        `;
        const reportHeaderCanvas = await renderDomTextToCanvas(headerHtml, 1000);
        const reportHeaderHeightInMm = (reportHeaderCanvas.height * contentWidth) / reportHeaderCanvas.width;
        const reportHeaderImgData = reportHeaderCanvas.toDataURL('image/jpeg', 0.95);

        // 2. 擷取視覺地圖
        const mapEl = document.getElementById('map-container');
        const mapCanvas = await window.html2canvas(mapEl, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
        const mapHeightInMm = (mapCanvas.height * contentWidth) / mapCanvas.width;
        const mapImgData = mapCanvas.toDataURL('image/jpeg', 0.95);

        // 3. 擷取溝通行動對策總表 (整張表格容器，結構完整絕不報錯)
        const tableCard = document.getElementById('table-card');
        let tableImgData = null, tableHeightInMm = 0;
        if (tableCard) {
          const tableCanvas = await window.html2canvas(tableCard, {
            scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false,
            // 下拉選單在 PDF 中換成靜態文字標籤
            onclone: (clonedDoc) => {
              clonedDoc.querySelectorAll('select[data-scenario]').forEach(sel => {
                const span = clonedDoc.createElement('span');
                span.className = 'inline-block px-1.5 py-0.5 mb-1.5 text-[10px] font-bold bg-blue-50 text-blue-700 rounded border border-blue-200';
                span.textContent = sel.options[sel.selectedIndex]?.text || '';
                sel.replaceWith(span);
              });
            }
          });
          tableHeightInMm = (tableCanvas.height * contentWidth) / tableCanvas.width;
          tableImgData = tableCanvas.toDataURL('image/jpeg', 0.95);
        }

        // 4. 智能排版：判斷是否能容納於單頁，或是優雅分頁
        let currentY = margin;
        pdf.addImage(reportHeaderImgData, 'JPEG', margin, currentY, contentWidth, reportHeaderHeightInMm);
        currentY += reportHeaderHeightInMm + 4;

        pdf.addImage(mapImgData, 'JPEG', margin, currentY, contentWidth, mapHeightInMm);
        currentY += mapHeightInMm + 5;

        if (tableImgData) {
          // 若剩餘高度不足以容納完整表格，則在第 2 頁獨立呈現對策總表
          if (currentY + tableHeightInMm > pageHeight - margin) {
            pdf.addPage();
            currentY = margin;
            pdf.addImage(reportHeaderImgData, 'JPEG', margin, currentY, contentWidth, reportHeaderHeightInMm);
            currentY += reportHeaderHeightInMm + 5;
          }
          pdf.addImage(tableImgData, 'JPEG', margin, currentY, contentWidth, tableHeightInMm);
        }

        const fileName = `利害關係人溝通行動對策報告_v${APP_BUILD_TIMESTAMP}.pdf`;
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (isMobileDevice) {
          const pdfBlob = pdf.output('blob');
          const blobUrl = URL.createObjectURL(pdfBlob);
          const actionsHtml = `
            <a href="${blobUrl}" download="${fileName}" class="block w-full py-2.5 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-md">
              點擊下載 PDF 檔案
            </a>
          `;
          showNotice('PDF 報告已成功產生！請點擊下方按鈕下載或預覽。', actionsHtml);
        } else {
          pdf.save(fileName);
          closeNoticeModal();
        }
      } catch (err) {
        console.error('PDF export error:', err);
        showNotice('PDF 產生過程發生錯誤：' + (err.message || '請重新整理後再試一次。'));
      }
    }

    // 初始化執行
    document.getElementById('version-tag').textContent = `v_${APP_BUILD_TIMESTAMP}`;
    updateRings();
    render();

    // 畫布尺寸改變（視窗縮放、手機旋轉）時，重算圓環與距離分級，確保畫面與判定一致
    (function watchMapSize() {
      const mapEl = document.getElementById('map-container');
      const refresh = () => {
        if (dragState && dragState.moved) return;
        updateRings();
        render();
      };
      if ('ResizeObserver' in window) new ResizeObserver(refresh).observe(mapEl);
      else window.addEventListener('resize', refresh);
    })();
  </script>
</body>
